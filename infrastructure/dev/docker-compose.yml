version: '3.8'

services:
  mongodb:
    image: mongo:8.2.5
    container_name: lute-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - lute-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lute-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - lute-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: api/Dockerfile
      args:
        - WORKER_VERSION=${WORKER_VERSION:-0.1.0}
        - BUILD_TIME=${BUILD_TIME:-unknown}
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
        - VITE_METRICS_UPDATE_INTERVAL_SECONDS=${VITE_METRICS_UPDATE_INTERVAL_SECONDS:-5}
    container_name: lute-api
    restart: unless-stopped
    ports:
      - "${API_HTTP_PORT:-8080}:8080" # HTTP
      - "${API_GRPC_PORT:-50051}:50051" # gRPC
    environment:
      # Server
      SERVER_PORT: ${SERVER_PORT}
      SERVER_HOST: ${SERVER_HOST}
      GIN_MODE: ${GIN_MODE}
      # MongoDB
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE}
      # gRPC
      GRPC_PORT: ${GRPC_PORT}
      GRPC_HOST: ${GRPC_HOST}
      # WebSocket
      WS_READ_BUFFER_SIZE: ${WS_READ_BUFFER_SIZE}
      WS_WRITE_BUFFER_SIZE: ${WS_WRITE_BUFFER_SIZE}
      WS_CHECK_ORIGIN: ${WS_CHECK_ORIGIN}
      # Firebase
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON}
      # Worker binaries
      WORKER_BINARY_DIR: /opt/lute/worker-binaries
      # Metrics snapshot job: how often we write snapshots to DB (e.g. 5s). Use 5s for chart resolution.
      METRICS_SNAPSHOT_INTERVAL: ${METRICS_SNAPSHOT_INTERVAL:-5s}
      # How often we ping workers for status + metrics. Should be <= METRICS_SNAPSHOT_INTERVAL so each snapshot has fresh metrics.
      HEARTBEAT_CHECK_INTERVAL: ${HEARTBEAT_CHECK_INTERVAL:-5s}
      # Redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lute-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:8080/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  lute-network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:
