version: '3.8'

services:
  api:
    build:
      context: ../..
      dockerfile: api/Dockerfile
      args:
        - WORKER_VERSION=${WORKER_VERSION:-0.1.0}
        - BUILD_TIME=${BUILD_TIME:-unknown}
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
        - VITE_METRICS_UPDATE_INTERVAL_SECONDS=${VITE_METRICS_UPDATE_INTERVAL_SECONDS:-5}
    container_name: lute-api
    restart: unless-stopped
    ports:
      - "${API_HTTP_PORT:-8080}:8080" # HTTP
      - "${API_GRPC_PORT:-50051}:50051" # gRPC
    environment:
      # Server
      SERVER_PORT: ${SERVER_PORT}
      SERVER_HOST: ${SERVER_HOST}
      GIN_MODE: ${GIN_MODE}
      # SQLite (persistent app data + job queue)
      SQLITE_PATH: ${SQLITE_PATH:-/data/lute.db}
      SQLITE_BUSY_TIMEOUT: ${SQLITE_BUSY_TIMEOUT:-5s}
      # gRPC
      GRPC_PORT: ${GRPC_PORT}
      GRPC_HOST: ${GRPC_HOST}
      # WebSocket
      WS_READ_BUFFER_SIZE: ${WS_READ_BUFFER_SIZE}
      WS_WRITE_BUFFER_SIZE: ${WS_WRITE_BUFFER_SIZE}
      WS_CHECK_ORIGIN: ${WS_CHECK_ORIGIN}
      # Firebase
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON}
      # Worker binaries
      WORKER_BINARY_DIR: /opt/lute/worker-binaries
      # Metrics snapshot job: how often we write snapshots to DB (e.g. 5s). Use 5s for chart resolution.
      METRICS_SNAPSHOT_INTERVAL: ${METRICS_SNAPSHOT_INTERVAL:-5s}
      # How often we ping workers for status + metrics. Should be <= METRICS_SNAPSHOT_INTERVAL so each snapshot has fresh metrics.
      HEARTBEAT_CHECK_INTERVAL: ${HEARTBEAT_CHECK_INTERVAL:-5s}
    volumes:
      - sqlite_data:/data
    networks:
      - lute-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:8080/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  lute-network:
    driver: bridge

volumes:
  sqlite_data:
