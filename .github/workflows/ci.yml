name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Repository tests run against real Postgres; pgtest fails (not skips) under CI without one.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lute
          POSTGRES_PASSWORD: lute
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: |
            api/go.sum
            worker/go.sum
            shared/proto/go.sum
      - name: Check formatting
        run: make go-format-check
      - name: Test
        env:
          LUTE_E2E_POSTGRES_DSN: postgres://lute:lute@localhost:5432/postgres?sslmode=disable
        run: make go-test
      - name: Lint
        run: make go-lint

  ui:
    name: UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build
