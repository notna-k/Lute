name: Worker image

# Publishes ghcr.io/<owner>/lute-worker on a worker-v* tag: worker-v0.2.0 pushes 0.2.0, 0.2 and latest.
on:
  push:
    tags: ['worker-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lute-worker
          tags: |
            type=match,pattern=worker-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=worker-v(\d+\.\d+),group=1
            type=raw,value=latest

      - id: version
        run: echo "version=${GITHUB_REF_NAME#worker-v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WORKER_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
