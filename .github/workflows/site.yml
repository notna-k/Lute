name: Site

# Builds the home page and docs (site/) on every PR that touches them, and publishes to
# GitHub Pages from master. The API reference is generated from api/openapi.yaml.
on:
  push:
    branches: [master]
    paths: &paths
      - site/**
      - api/openapi.yaml
      - docs/media/**
      - .github/workflows/site.yml
  pull_request:
    branches: [master]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Build
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
