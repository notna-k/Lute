name: Images

# Publishes ghcr.io/<owner>/lute-<image> from a <image>-v* tag:
#   core-v0.2.0   -> lute-core:0.2.0, :0.2, :latest
#   worker-v0.2.0 -> lute-worker:0.2.0, :0.2, :latest
# A tag builds only if the image's sources changed since the previous tag of that image
# (GitHub ignores `paths:` filters on tag pushes, so the plan job diffs them itself).
# Core is built with the WORKER_VERSION from the Makefile: the worker release it recommends.
# A manual run always builds and pushes only a sha-<commit> tag.
on:
  push:
    tags: ['core-v*', 'worker-v*']
  workflow_dispatch:
    inputs:
      image:
        type: choice
        options: [core, worker]

permissions:
  contents: read
  packages: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.plan.outputs.image }}
      file: ${{ steps.plan.outputs.file }}
      version: ${{ steps.plan.outputs.version }}
      worker_version: ${{ steps.plan.outputs.worker_version }}
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the previous tag and its history

      - id: plan
        env:
          INPUT_IMAGE: ${{ inputs.image }}
        run: |
          image="${INPUT_IMAGE:-${GITHUB_REF_NAME%%-v*}}"
          case "$image" in
            core)   file=api/Dockerfile;    paths="api shared/proto" ;;
            worker) file=worker/Dockerfile; paths="worker shared/proto" ;;
            *) echo "unknown image: $image" >&2; exit 1 ;;
          esac
          worker_version_at() { git show "$1:Makefile" | sed -n 's/^export WORKER_VERSION *?= *//p'; }

          version=dev
          worker_version="$(worker_version_at HEAD)"
          changed=true
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#"$image"-v}"
            [ "$image" = worker ] && worker_version="$version"
            if prev="$(git describe --tags --abbrev=0 --match "$image-v*" HEAD^ 2>/dev/null)"; then
              changed=false
              # shellcheck disable=SC2086
              git diff --quiet "$prev" HEAD -- $paths || changed=true
              # core also bakes in the recommended worker version
              [ "$image" = core ] && [ "$(worker_version_at "$prev")" != "$worker_version" ] && changed=true
              echo "previous tag $prev, changed=$changed"
            fi
          fi
          {
            echo "image=$image"
            echo "file=$file"
            echo "version=$version"
            echo "worker_version=$worker_version"
            echo "changed=$changed"
          } >> "$GITHUB_OUTPUT"

  image:
    name: Build and push
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lute-${{ needs.plan.outputs.image }}
          tags: |
            type=match,pattern=${{ needs.plan.outputs.image }}-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=${{ needs.plan.outputs.image }}-v(\d+\.\d+),group=1
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,enable=${{ github.ref_type != 'tag' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ needs.plan.outputs.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CORE_VERSION=${{ needs.plan.outputs.version }}
            WORKER_VERSION=${{ needs.plan.outputs.worker_version }}
          cache-from: type=gha,scope=${{ needs.plan.outputs.image }}
          cache-to: type=gha,mode=max,scope=${{ needs.plan.outputs.image }}
