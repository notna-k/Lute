name: Images

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      images: ${{ github.event_name == 'workflow_dispatch' && '["core","worker"]' || steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            core:
              - api/**
              - ui/**
              - shared/proto/**
              - Makefile
            worker:
              - worker/**
              - shared/proto/**
              - Makefile

  image:
    name: ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v7

      - name: Read versions
        run: sed -n 's/^export \(CORE_VERSION\|WORKER_VERSION\) *?= */\1=/p' Makefile >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lute-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ matrix.image == 'core' && env.CORE_VERSION || env.WORKER_VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ matrix.image == 'core' && env.CORE_VERSION || env.WORKER_VERSION }}
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image == 'core' && 'api' || 'worker' }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CORE_VERSION=${{ env.CORE_VERSION }}
            WORKER_VERSION=${{ env.WORKER_VERSION }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
